#

name: nestpet
description: "Uma aplicação para facilitar o processo de adoção de animais!"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.0.0 # Navegação declarativa e deep links
  provider: ^6.1.2 # Gerência de estado simples e injeção de dependências
  path_provider: ^2.1.3 # Diretórios do dispositivo (documentos, cache, temp)
  file_picker: ^10.3.7 # Seleção de arquivos do sistema (imagens, vídeos, docs)
  video_player: ^2.9.1 # Reprodução de vídeos locais/streaming
  uuid: ^4.4.2 # Geração de identificadores únicos
  supabase_flutter: ^2.10.3 # Cliente Supabase (auth, DB, storage, realtime)
  image_picker: ^1.1.0 # Captura/seleção de imagens e vídeos
  sign_in_with_apple: ^7.0.1 # Login com Apple em iOS/macOS
  shared_preferences: ^2.1.1 # Persistência simples chave-valor
  url_launcher: ^6.1.12 # Abrir URLs, e-mails, telefone, mapas
  app_links: ^6.4.1 # Tratamento de deep links/universal links
  http: ^0.13.6 # Cliente HTTP para requisições REST

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4 # Geração de ícones para Android/iOS
  flutter_native_splash: ^2.2.16 # Tela de splash nativa configurável


  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - lib/assets/NestPet_logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/NestPet_Icon.png"
  adaptive_icon_background: "#F2E8D7"
  adaptive_icon_foreground: "lib/assets/NestPet_Icon.png"

flutter_native_splash:
  color: "#F2E8D7"
  image: "lib/assets/NestPet_Icon.png"
  android: true
  ios: true
  android_12:
    color: "#F2E8D7"
    image: "lib/assets/NestPet_Icon.png"

flutter_launcher_icons:
  android: true
  image_path: "lib/assets/NestPet_Icon.png"
  adaptive_icon_foreground: "lib/assets/NestPet_Icon.png"
  adaptive_icon_background: "#F2E8D7"
